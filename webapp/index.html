<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video Publisher</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#161513">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Video Publisher</h1>
  </header>

  <section id="connect-section">
    <h2>Accounts</h2>
    <div class="account-row">
      <span class="account-name">YouTube</span>
      <span id="yt-status" class="status-dot" data-connected="false"></span>
      <span id="yt-status-text" class="status-text">Not connected</span>
      <button id="yt-connect-btn" class="btn-secondary">Connect</button>
    </div>
    <div class="account-row">
      <span class="account-name">Instagram</span>
      <span id="ig-status" class="status-dot" data-connected="false"></span>
      <span id="ig-status-text" class="status-text">Not connected</span>
      <button id="ig-connect-btn" class="btn-secondary">Connect</button>
    </div>
  </section>

  <section id="upload-section">
    <h2>Publish a video</h2>

    <div id="drop-area">
      <input type="file" id="file-input" accept="video/*" hidden>
      <button id="pick-btn" class="btn-secondary">Choose video</button>
      <p id="file-name">No video selected — or share one in from your editor.</p>
      <video id="preview" controls></video>
    </div>

    <div class="platform-row">
      <label class="platform-check">
        <input type="checkbox" id="platform-yt" checked>
        <span>YouTube</span>
      </label>
      <label class="platform-check">
        <input type="checkbox" id="platform-ig" checked>
        <span>Instagram</span>
      </label>
    </div>

    <label for="caption-main">Caption</label>
    <textarea id="caption-main" rows="4" placeholder="Used for both platforms unless you set one below"></textarea>

    <label class="platform-check">
      <input type="checkbox" id="split-caption">
      <span>Different caption for Instagram</span>
    </label>
    <div id="ig-caption-wrap" hidden>
      <label for="caption-ig">Instagram caption</label>
      <textarea id="caption-ig" rows="4"></textarea>
    </div>

    <p id="validation-msg" class="validation-msg" hidden></p>

    <button id="publish-btn" class="btn-primary" disabled>Publish</button>
    <div id="publish-status"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
